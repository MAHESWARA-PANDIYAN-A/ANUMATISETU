databases:
  - name: anumatisetu-db
    databaseName: sih_industrial_db
    user: postgres
    plan: free
    region: singapore

services:
  # ─── 1. FASTAPI BACKEND WEB SERVICE ──────────────────────────────────────────
  - type: web
    name: anumatisetu-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anumatisetu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PROJECT_NAME
        value: "ANUMATISETU Unified National Industrial Approvals Platform"

  # ─── 2. REACT + VITE FRONTEND STATIC SITE ───────────────────────────────────
  - type: web
    name: anumatisetu-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: anumatisetu-backend
          property: host
